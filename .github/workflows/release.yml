name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Validate and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --release --locked
          test "$(./target/release/flux-pro --version)" = "flux-pro ${RELEASE_TAG#v}"
          bash -n install.sh uninstall.sh
          shellcheck install.sh uninstall.sh
          python3 scripts/package-release.py
          cd dist
          sha256sum --check SHA256SUMS
          mkdir unpacked
          tar -xzf ./*.tar.gz -C unpacked
          cd unpacked/flux-pro-*
          ./flux-pro --version
          ./install.sh --destdir "$RUNNER_TEMP/flux-pro-stage"
          cmp flux-pro "$RUNNER_TEMP/flux-pro-stage/usr/local/bin/flux-pro"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --draft --verify-tag --title "Flux Pro $RELEASE_TAG" \
            --notes-file dist/RELEASE_NOTES.md
